<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>toast FLIP repro2</title>
<style>
  body { margin: 0; height: 100vh; background: #111; }
  #log { position: fixed; top: 8px; left: 8px; z-index: 999999; font: 12px monospace; color: #0f0; white-space: pre; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<pre id="log"></pre>
<script>
const DEFAULT_TIME = 2000;
const ICON_SIZE = 20;
const EXIT_REMOVE_DELAY_MS = 280;
const REPOSITION_DURATION_MS = 1000; // 与当前 toast.ts 一致
const REPOSITION_EASING = 'cubic-bezier(0.4, 0, 0.2, 1)';

let container = null;
let queue = [];

function getContainer() {
  if (container && container.isConnected) return container;
  container = document.createElement('div');
  container.id = '__TOAST_CONTAINER__';
  container.style.cssText = `
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    z-index: 99999;
    pointer-events: none;
    padding: 0 16px;
    max-width: 100vw;
    box-sizing: border-box;
  `;
  document.body.appendChild(container);
  queue = [];
  return container;
}

function dismiss(toastEl) {
  toastEl.style.transform = 'translateX(calc(100% + 40px))';
  toastEl.style.opacity = '0';

  setTimeout(() => {
    if (container && toastEl.parentNode === container) {
      const remaining = Array.from(container.children);
      const firstTop = new Map();
      remaining.forEach((el) => firstTop.set(el, el.getBoundingClientRect().top));

      container.removeChild(toastEl);
      queue = queue.filter((t) => t !== toastEl);

      remaining.forEach((el) => {
        const delta = firstTop.get(el) - el.getBoundingClientRect().top;
        if (delta === 0) return;
        el.getAnimations().forEach((a) => a.cancel());
        el.animate(
          [{ transform: `translateY(${delta}px)` }, { transform: 'translateY(0)' }],
          { duration: REPOSITION_DURATION_MS, easing: REPOSITION_EASING, fill: 'backwards' }
        );
      });
    }
  }, EXIT_REMOVE_DELAY_MS);
}

function showToast(msg, time = 999999) {
  const host = getContainer();
  const toastEl = document.createElement('div');
  toastEl.className = 'toast-item';
  toastEl.textContent = msg;
  toastEl.style.cssText = `
    display: flex;
    align-items: center;
    width: 300px;
    box-sizing: border-box;
    background: rgba(30, 30, 32, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #f5f5f7;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    opacity: 0;
    transform: translateX(calc(100% + 40px));
    transition:
      transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
      opacity 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform, opacity;
    pointer-events: auto;
    cursor: pointer;
  `;
  host.appendChild(toastEl);
  queue.push(toastEl);
  const delay = 60 * (queue.length - 1);
  setTimeout(() => {
    requestAnimationFrame(() => {
      toastEl.style.transform = 'translateX(0)';
      toastEl.style.opacity = '1';
    });
  }, delay);
  const timer = setTimeout(() => dismiss(toastEl), time);
  toastEl.addEventListener('click', () => { clearTimeout(timer); dismiss(toastEl); });
  return { close: () => { clearTimeout(timer); dismiss(toastEl); } };
}

const log = document.getElementById('log');
function say(...args) { log.textContent += args.join(' ') + '\n'; }

const getEl = (i) => document.querySelectorAll('.toast-item')[i];

function sample(elName, el, ms, cb) {
  const samples = [];
  let last = el.getBoundingClientRect().top;
  const iv = setInterval(() => {
    const top = el.getBoundingClientRect().top;
    samples.push({ t: samples.length * 33, top: Math.round(top), d: Math.round(top - last) });
    last = top;
  }, 33);
  setTimeout(() => {
    clearInterval(iv);
    say('--- ' + elName + ' 位移采样（t ms: top, delta） ---');
    samples.forEach((s) => say(s.t + 'ms: top=' + s.top + ' delta=' + s.d));
    const maxJump = Math.max(...samples.map((s) => Math.abs(s.d)));
    say(elName + ' 最大单帧跳跃: ' + maxJump + 'px ' + (maxJump > 40 ? '=> 瞬移!' : '=> 平滑'));
    cb();
  }, ms);
}

// 场景1：FIFO —— 移除顶部 toast，观察下方 toast 是否移动
window.sceneFifo = function () {
  showToast('A 顶', 999999);
  showToast('B 中', 999999);
  showToast('C 底', 999999);
  setTimeout(() => {
    say('=== 场景1：移除顶部 A ===');
    say('初始 B=' + Math.round(getEl(1).getBoundingClientRect().top) + ' C=' + Math.round(getEl(2).getBoundingClientRect().top));
    sample('B', getEl(1), 1000, () => {
      sample('C', getEl(2), 1000, () => say('场景1 DONE'));
    });
    setTimeout(() => getEl(0).click(), 300);
  }, 1000);
};

// 场景2：移除中间 toast，随后在 FLIP 进行中再次点击该 toast
window.sceneMidThenRapid = function () {
  showToast('A 顶', 999999);
  showToast('B 中', 999999);
  showToast('C 底', 999999);
  setTimeout(() => {
    say('=== 场景2：移除中间 B，然后 400ms 后再移除 A（A 正处于 FLIP 动画中） ===');
    // 记录 A 的动画状态
    const a = getEl(0);
    sample('A', a, 2000, () => say('场景2 DONE'));
    getEl(1).click();          // t=300ms 移除 B
    setTimeout(() => getEl(0).click(), 400); // t=700ms 移除 A（A 的 FLIP 进行中）
  }, 1000);
};

// 场景3：连续快速移除两个 toast（B 和 C），观察 A 的位移
window.sceneRapidTwo = function () {
  showToast('A 顶', 999999);
  showToast('B 中', 999999);
  showToast('C 底', 999999);
  setTimeout(() => {
    say('=== 场景3：t=300ms 移除 B，t=350ms 移除 C ===');
    sample('A', getEl(0), 2000, () => say('场景3 DONE'));
    setTimeout(() => getEl(1).click(), 300);
    setTimeout(() => getEl(2).click(), 350);
  }, 1000);
};
</script>
</body>
</html>
