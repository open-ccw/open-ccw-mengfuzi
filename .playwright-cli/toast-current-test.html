<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>toast current impl test</title>
<style>
  body { margin: 0; height: 100vh; background: #111; }
  #log { position: fixed; top: 8px; left: 8px; z-index: 999999; font: 12px monospace; color: #0f0; white-space: pre; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<pre id="log"></pre>
<script>
/* ====== 以下为 src/lib/toast.ts 的当前实现（精确复刻，去掉 Svelte/TS 语法） ====== */
const EXIT_DURATION_MS = 420;
const EXIT_REMOVE_DELAY_MS = EXIT_DURATION_MS + 40;
const REPOSITION_DURATION_MS = 360;
const REPOSITION_EASING = 'cubic-bezier(0.4, 0, 0.2, 1)';
const EXIT_EASING = 'cubic-bezier(0.34, 1.56, 0.64, 1)';

let container = null;
let queue = [];
const exiting = new Set();
const flipStates = new WeakMap();
const removalTimers = new Map();

function getTranslate(el) {
  const m = new DOMMatrixReadOnly(getComputedStyle(el).transform);
  return { x: m.e, y: m.f };
}

function getContainer() {
  if (container && container.isConnected) return container;
  container = document.createElement('div');
  container.id = '__TOAST_CONTAINER__';
  container.style.cssText = `
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    z-index: 99999;
    pointer-events: none;
    padding: 0 16px;
    max-width: 100vw;
    box-sizing: border-box;
  `;
  document.body.appendChild(container);
  queue = [];
  return container;
}

function scheduleRemoval(toastEl) {
  const prevTimer = removalTimers.get(toastEl);
  if (prevTimer !== undefined) window.clearTimeout(prevTimer);

  const timer = window.setTimeout(() => {
    removalTimers.delete(toastEl);
    exiting.delete(toastEl);
    if (!container || toastEl.parentNode !== container) return;

    const remaining = (Array.from(container.children)).filter((el) => el !== toastEl);
    const firstState = new Map();
    remaining.forEach((el) => {
      const t = getTranslate(el);
      firstState.set(el, { top: el.getBoundingClientRect().top, x: t.x });
    });

    container.removeChild(toastEl);
    queue = queue.filter((t) => t !== toastEl);

    remaining.forEach((el) => {
      const { top, x } = firstState.get(el);

      if (exiting.has(el)) {
        const deltaY = top - el.getBoundingClientRect().top;
        if (deltaY === 0) return;
        const t = getTranslate(el);
        const opacity = Number(getComputedStyle(el).opacity);
        el.getAnimations().forEach((a) => a.cancel());
        el.animate(
          [
            { transform: `translate(${t.x}px, ${deltaY}px)`, opacity },
            { transform: 'translateX(calc(100% + 40px))', opacity: 0 },
          ],
          { duration: EXIT_DURATION_MS, easing: EXIT_EASING, fill: 'forwards' }
        );
        scheduleRemoval(el);
        return;
      }

      el.getAnimations().forEach((a) => a.cancel());
      const newTop = el.getBoundingClientRect().top;
      const deltaY = top - newTop;
      if (deltaY === 0 && x === 0) return;

      const anim = el.animate(
        [
          { transform: `translate(${x}px, ${deltaY}px)` },
          { transform: 'translate(0px, 0px)' },
        ],
        { duration: REPOSITION_DURATION_MS, easing: REPOSITION_EASING }
      );
      flipStates.set(el, { anim });
      anim.addEventListener('finish', () => {
        if (flipStates.get(el)?.anim === anim) flipStates.delete(el);
      });
    });
  }, EXIT_REMOVE_DELAY_MS);

  removalTimers.set(toastEl, timer);
}

function dismiss(toastEl) {
  if (exiting.has(toastEl)) return;
  exiting.add(toastEl);

  const { x, y } = getTranslate(toastEl);

  if (x === 0 && y === 0) {
    toastEl.style.transform = 'translateX(calc(100% + 40px))';
    toastEl.style.opacity = '0';
  } else {
    toastEl.getAnimations().forEach((a) => a.cancel());
    flipStates.delete(toastEl);
    toastEl.animate(
      [
        { transform: `translate(${x}px, ${y}px)`, opacity: 1 },
        { transform: 'translateX(calc(100% + 40px))', opacity: 0 },
      ],
      { duration: EXIT_DURATION_MS, easing: EXIT_EASING, fill: 'forwards' }
    );
  }

  scheduleRemoval(toastEl);
}

function showToast(msg, time = 999999) {
  const host = getContainer();
  const toastEl = document.createElement('div');
  toastEl.className = 'toast-item';
  toastEl.textContent = msg;
  toastEl.style.cssText = `
    display: flex;
    align-items: center;
    width: 300px;
    box-sizing: border-box;
    background: rgba(30, 30, 32, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #f5f5f7;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    opacity: 0;
    transform: translateX(calc(100% + 40px));
    transition:
      transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
      opacity 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform, opacity;
    pointer-events: auto;
    cursor: pointer;
  `;
  host.appendChild(toastEl);
  queue.push(toastEl);
  const delay = 60 * (queue.length - 1);
  setTimeout(() => {
    requestAnimationFrame(() => {
      toastEl.style.transform = 'translateX(0)';
      toastEl.style.opacity = '1';
    });
  }, delay);
  const timer = setTimeout(() => dismiss(toastEl), time);
  toastEl.addEventListener('click', () => { clearTimeout(timer); dismiss(toastEl); });
  return { close: () => { clearTimeout(timer); dismiss(toastEl); } };
}
/* ====== toast.ts 复刻结束 ====== */

const log = document.getElementById('log');
function say(...args) { log.textContent += args.join(' ') + '\n'; }
const getEl = (i) => document.querySelectorAll('.toast-item')[i];

function sample(elName, el, ms, cb) {
  const samples = [];
  let last = el ? el.getBoundingClientRect().top : 0;
  const iv = setInterval(() => {
    const top = el ? el.getBoundingClientRect().top : -999;
    samples.push({ t: samples.length * 33, top: Math.round(top), d: Math.round(top - last) });
    last = top;
  }, 33);
  setTimeout(() => {
    clearInterval(iv);
    say('--- ' + elName + ' 位移采样（t ms: top, delta） ---');
    samples.forEach((s) => say(s.t + 'ms: top=' + s.top + ' delta=' + s.d));
    const maxJump = Math.max(...samples.map((s) => Math.abs(s.d)));
    say(elName + ' 最大单帧跳跃: ' + maxJump + 'px ' + (maxJump > 40 ? '=> 瞬移!' : '=> 平滑'));
    cb();
  }, ms);
}

window.runScenario = function (name) {
  say('######## ' + name + ' ########');
  if (name === 'remove-mid') {
    // 移除中间 B，观察下方 C 的补位
    showToast('A 顶', 999999);
    showToast('B 中', 999999);
    showToast('C 底', 999999);
    setTimeout(() => {
      say('=== remove-mid: t=300ms 移除 B，观察 C ===');
      const c = getEl(2);
      sample('C', c, 1600, () => say('remove-mid DONE'));
      getEl(1).click();
    }, 1000);
  } else if (name === 'remove-top') {
    // 移除顶部 A，观察 B 和 C
    showToast('A 顶', 999999);
    showToast('B 中', 999999);
    showToast('C 底', 999999);
    setTimeout(() => {
      say('=== remove-top: t=300ms 移除 A，观察 B/C ===');
      sample('B', getEl(1), 1600, () => say('remove-top DONE'));
      getEl(0).click();
    }, 1000);
  } else if (name === 'insert') {
    // 新插入一条，观察已有 toast 是否移动
    showToast('A 顶', 999999);
    showToast('B 中', 999999);
    setTimeout(() => {
      say('=== insert: t=300ms 插入 D，观察 A/B ===');
      sample('A', getEl(0), 1600, () => say('insert DONE'));
      showToast('D 新', 999999);
    }, 1000);
  } else if (name === 'mid-then-top') {
    // B 移除后 400ms 内再移除 A（A 补位/退出中）
    showToast('A 顶', 999999);
    showToast('B 中', 999999);
    showToast('C 底', 999999);
    setTimeout(() => {
      say('=== mid-then-top: t=300ms 移除 B，t=600ms 移除 A ===');
      sample('C', getEl(2), 2000, () => say('mid-then-top DONE'));
      getEl(1).click();
      setTimeout(() => getEl(0).click(), 600);
    }, 1000);
  }
};
</script>
</body>
</html>
