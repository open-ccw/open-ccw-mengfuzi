<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>toast FLIP repro</title>
<style>
  body { margin: 0; height: 100vh; background: #111; }
  #log { position: fixed; top: 8px; left: 8px; z-index: 999999; font: 12px monospace; color: #0f0; white-space: pre; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<pre id="log"></pre>
<script>
// ---- 复刻 src/lib/toast.ts 的核心逻辑（纯 DOM 版） ----
const DEFAULT_MSG = 'success';
const DEFAULT_TIME = 2000;
const ICON_SIZE = 20;
const EXIT_REMOVE_DELAY_MS = 280;
const REPOSITION_DURATION_MS = 360;
const REPOSITION_EASING = 'cubic-bezier(0.4, 0, 0.2, 1)';

let container = null;
let queue = [];

function getContainer() {
  if (container && container.isConnected) return container;
  container = document.createElement('div');
  container.id = '__TOAST_CONTAINER__';
  container.style.cssText = `
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    z-index: 99999;
    pointer-events: none;
    padding: 0 16px;
    max-width: 100vw;
    box-sizing: border-box;
  `;
  document.body.appendChild(container);
  queue = [];
  return container;
}

function dismiss(toastEl) {
  toastEl.style.transform = 'translateX(calc(100% + 40px))';
  toastEl.style.opacity = '0';

  setTimeout(() => {
    if (container && toastEl.parentNode === container) {
      const remaining = Array.from(container.children).filter((el) => el !== toastEl);
      const firstTop = new Map();
      remaining.forEach((el) => firstTop.set(el, el.getBoundingClientRect().top));

      container.removeChild(toastEl);
      queue = queue.filter((t) => t !== toastEl);

      remaining.forEach((el) => {
        const delta = firstTop.get(el) - el.getBoundingClientRect().top;
        if (delta === 0) return;
        el.getAnimations().forEach((a) => a.cancel());
        el.animate(
          [{ transform: `translateY(${delta}px)` }, { transform: 'translateY(0)' }],
          { duration: REPOSITION_DURATION_MS, easing: REPOSITION_EASING, fill: 'backwards' }
        );
      });
    }
  }, EXIT_REMOVE_DELAY_MS);
}

function showToast(options = {}) {
  const { msg = DEFAULT_MSG, time = DEFAULT_TIME } = options;
  const host = getContainer();
  const toastEl = document.createElement('div');
  toastEl.className = 'toast-item';
  toastEl.textContent = msg;
  toastEl.style.cssText = `
    display: flex;
    align-items: center;
    width: 300px;
    box-sizing: border-box;
    background: rgba(30, 30, 32, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #f5f5f7;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    opacity: 0;
    transform: translateX(calc(100% + 40px));
    transition:
      transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
      opacity 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform, opacity;
    pointer-events: auto;
    cursor: pointer;
  `;
  host.appendChild(toastEl);
  queue.push(toastEl);

  const delay = 60 * (queue.length - 1);
  setTimeout(() => {
    requestAnimationFrame(() => {
      toastEl.style.transform = 'translateX(0)';
      toastEl.style.opacity = '1';
    });
  }, delay);

  const timer = setTimeout(() => dismiss(toastEl), time);
  toastEl.addEventListener('click', () => {
    clearTimeout(timer);
    dismiss(toastEl);
  });
  return {
    close: () => { clearTimeout(timer); dismiss(toastEl); },
  };
}

// ---- 测试入口 ----
const log = document.getElementById('log');
function say(...args) { log.textContent += args.join(' ') + '\n'; }

window.__log = say;

window.runTest = function () {
  const handles = [showToast({ msg: 'Toast A（上）', time: 999999 }), showToast({ msg: 'Toast B（中）', time: 999999 }), showToast({ msg: 'Toast C（下）', time: 999999 })];
  const a = document.querySelectorAll('.toast-item')[0];
  const b = document.querySelectorAll('.toast-item')[1];
  const c = document.querySelectorAll('.toast-item')[2];

  // 等入场动画完成
  setTimeout(() => {
    say('--- 入场后初始位置 ---');
    say('A top=' + Math.round(a.getBoundingClientRect().top));
    say('B top=' + Math.round(b.getBoundingClientRect().top));
    say('C top=' + Math.round(c.getBoundingClientRect().top));

    say('--- 移除中间 toast B，开始采样 A 的位置 ---');
    const samples = [];
    let last = a.getBoundingClientRect().top;
    const iv = setInterval(() => {
      const top = a.getBoundingClientRect().top;
      samples.push({ t: samples.length * 33, top: Math.round(top), d: Math.round(top - last) });
      last = top;
    }, 33);

    setTimeout(() => {
      handles[1].close(); // 移除中间 B
    }, 300);

    setTimeout(() => {
      clearInterval(iv);
      say('--- A 的位移采样（t ms: top, 每帧增量） ---');
      samples.forEach((s) => say(s.t + 'ms: top=' + s.top + ' delta=' + s.d));
      const maxJump = Math.max(...samples.map((s) => Math.abs(s.d)));
      say('最大单帧跳跃: ' + maxJump + 'px ' + (maxJump > 40 ? '=> 瞬移!' : '=> 平滑'));
      say('--- DONE ---');
    }, 1800);
  }, 1000);
};
</script>
</body>
</html>
